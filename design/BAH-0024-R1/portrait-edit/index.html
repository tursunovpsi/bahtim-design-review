<!doctype html><html lang="ru" data-design="bah0013" data-theme="male"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ответить на вопрос · BAHTIM</title><link rel="stylesheet" href="style.css"><script defer src="../copy.js"></script><script defer src="../life-library.js"></script><script defer src="../geography.js"></script><script defer src="../welcome-template.js"></script><script defer src="../screens.js"></script><script defer src="../extended-screens.js"></script><script defer src="../prototype.js"></script><script defer src="../gallery.js"></script><script defer src="../visual.js"></script><script defer src="../review-forms.js"></script></head><body data-screen="portrait-edit"><main class="app" data-screen="portrait-edit"><h1>Ответить на вопрос</h1><p>Выберите вопрос, который откликается, и ответьте так, как рассказали бы другу.</p><section class="panel soft"><h2>Вопросы для вас</h2><p class="note">Воспоминания</p></section><form data-review-form="portrait-edit"><label class="field"><span>Свой вопрос</span><input name="portrait-question" required maxlength="200"></label><label class="field"><span>Ваш ответ</span><textarea name="portrait-answer" required minlength="10" maxlength="700"></textarea></label><p class="note">От 10 до 700 символов. Без телефонов, адресов и ссылок.</p><p class="form-error" role="alert" hidden></p><div class="actions"><button class="primary" type="submit">Сохранить изменения</button></div></form><p class="note">Ответы видят те, кому доступна ваша анкета. Изменить или удалить их можно в любой момент.</p></main></body></html>
