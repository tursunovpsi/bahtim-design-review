<!doctype html><html lang="ru" data-design="bah0013" data-theme="male"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Помогите сохранить безопасность · BAHTIM</title><link rel="stylesheet" href="style.css"><script defer src="../copy.js"></script><script defer src="../life-library.js"></script><script defer src="../geography.js"></script><script defer src="../welcome-template.js"></script><script defer src="../screens.js"></script><script defer src="../extended-screens.js"></script><script defer src="../prototype.js"></script><script defer src="../gallery.js"></script><script defer src="../visual.js"></script><script defer src="../review-forms.js"></script></head><body data-screen="report"><main class="app" data-screen="report"><h1>Помогите сохранить безопасность</h1><p>Жалоба доступна команде сервиса, а не человеку, на которого вы жалуетесь.</p><form data-review-form="report"><label class="field"><span>Причина</span><select name="report-reason"><option value="chooseReason">Выберите причину</option><option value="r_scam">Мошенничество</option><option value="r_threats">Угрозы или вымогательство</option><option value="r_paid_services">Платные интимные услуги</option><option value="r_exploitation">Сексуальная эксплуатация</option><option value="r_spam">Незаконная реклама или спам</option><option value="r_fake">Фейк или чужие фото</option><option value="r_rude">Грубость, оскорбления</option><option value="r_married">Состоит в браке</option><option value="r_other">Другое</option></select></label><label class="field"><span>Что произошло?</span><textarea name="report-text" required maxlength="1000"></textarea></label><p class="note">После жалобы человек всегда скрывается от вас — так безопаснее.</p><p class="note">Команда рассмотрит сведения. Санкции применяются после проверки нарушения.</p><p class="form-error" role="alert" hidden></p><div class="actions"><button class="primary" type="submit">Отправить жалобу</button></div></form></main></body></html>
